<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Беларусь в масштабе</title>
<meta name="description" content="Страница здания парка миниатюр «Беларусь в масштабе».">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="index.html">Беларусь в масштабе</a>
    <nav>
      <a href="index.html#miniatures">Все миниатюры</a>
      <a href="index.html#planned">Планируются</a>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap"><a href="index.html">Беларусь в масштабе</a> · парк миниатюр</div>
</footer>

<div class="lb" id="lb" role="dialog" aria-label="Фотография"><img alt=""></div>
<div class="m3d" id="m3d" role="dialog" aria-label="3D-модель"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("id");
  var idx = -1;
  BUILDINGS.forEach(function (b, i) { if (b.id === id) idx = i; });
  var app = $("#app");

  if (idx === -1) {
    app.innerHTML = '<div class="empty"><h2>Здание не найдено</h2><p><a class="btn primary" href="index.html#miniatures">Перейти ко всем миниатюрам</a></p></div>';
    return;
  }

  var b = BUILDINGS[idx];
  document.title = b.name + " – Беларусь в масштабе";
  var md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute("content", b.short);

  function fact(label, value) {
    return value ? "<div><small>" + esc(label) + "</small><b>" + esc(value) + "</b></div>" : "";
  }

  function gallery(title, list) {
    var items = photoList(list);
    if (!items.length) return "";
    return "<h2 style='margin-top:32px;font-size:1.4rem'>" + esc(title) + '</h2><div class="gallery">' +
      items.map(function (p) {
        return '<figure><button type="button" data-src="' + esc(p.src) + '"><img src="' + esc(p.src) +
          '" alt="' + esc(p.caption || b.name) + '" onerror="dropPhoto(this)"></button>' +
          (p.caption ? "<figcaption>" + esc(p.caption) + "</figcaption>" : "") + "</figure>";
      }).join("") + "</div>";
  }

  var prev = BUILDINGS[(idx + BUILDINGS.length - 1) % BUILDINGS.length];
  var next = BUILDINGS[(idx + 1) % BUILDINGS.length];
  var noPhotos = !photoList(b.photos).length && !photoList(b.archive).length;

  // Если файла фото нет, убираем его; если не осталось ни одного, показываем «скоро появятся»
  window.dropPhoto = function (img) {
    var fig = img.closest("figure"), g = fig.parentNode;
    fig.remove();
    if (!g.querySelector("figure")) {
      var h2 = g.previousElementSibling;
      g.remove();
      if (h2 && h2.tagName === "H2") h2.remove();
    }
    if (!document.querySelector(".gallery")) {
      var n = document.getElementById("nophotos");
      if (n) n.hidden = false;
    }
  };

  app.innerHTML =
    '<div class="crumbs"><a href="index.html#miniatures">← Все миниатюры</a></div>' +
    '<div class="b-head">' + badgeHTML(b) + "<h1>" + esc(b.name) + '</h1><p class="meta">' + esc(metaLine(b)) + "</p></div>" +
    '<div class="b-cover">' + coverHTML(b, true) + "</div>" +
    '<div class="facts">' + fact("Город", b.city) + fact("Год", b.year) + fact("Стиль", b.style) +
      fact("Состояние", STATUS_LABEL[b.status]) + "</div>" +
    '<div class="b-text"><p>' + esc(b.desc) + "</p></div>" +
    gallery("Фотографии", b.photos) +
    gallery("Архивные фотографии", b.archive) +
    '<p class="note" id="nophotos"' + (noPhotos ? "" : " hidden") + '>Фотографии этого здания скоро появятся.</p>' +
    '<div class="view3d" id="view3d" hidden><h2 style="margin-top:32px;font-size:1.4rem">3D-модель</h2>' +
      '<p class="note" style="margin:6px 0 12px">Откроется объёмная модель: её можно вращать и приближать.</p>' +
      '<button class="btn primary" id="open3d" type="button">Смотреть в 3D</button></div>' +
    '<div class="pn"><a class="btn" href="' + buildingUrl(prev) + '">← ' + esc(prev.name) +
    '</a><a class="btn" href="' + buildingUrl(next) + '">' + esc(next.name) + " →</a></div>";

  // ----- 3D-модель -----
  // Файл ищется как models/<id>.glb. Если он есть, показывается кнопка «Смотреть в 3D».
  var modelUrl = b.model || ("models/" + b.id + ".glb");
  var m3d = $("#m3d");
  var VIEWER_SRC = [
    "https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js",
    "https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"
  ];

  fetch(modelUrl, { method: "HEAD" }).then(function (r) {
    if (r.ok) $("#view3d").hidden = false;
  }).catch(function () {});

  function loadViewer(ok, fail) {
    if (window.customElements && customElements.get("model-viewer")) return ok();
    (function next(i) {
      if (i >= VIEWER_SRC.length) return fail();
      var s = document.createElement("script");
      s.type = "module";
      s.src = VIEWER_SRC[i];
      s.onload = function () { customElements.whenDefined("model-viewer").then(ok); };
      s.onerror = function () { s.remove(); next(i + 1); };
      document.head.appendChild(s);
    })(0);
  }

  function open3d() {
    m3d.innerHTML =
      '<div class="m3d-bar"><b>' + esc(b.name) + '</b><button type="button" class="btn" id="close3d">Закрыть ✕</button></div>' +
      '<div class="m3d-stage" id="stage3d"><p class="m3d-msg" id="msg3d">Загрузка модели…</p></div>' +
      '<p class="m3d-hint">Вращение: мышь или палец. Приближение: колесо мыши или два пальца.</p>';
    m3d.classList.add("open");
    document.body.style.overflow = "hidden";
    var msg = $("#msg3d"), stage = $("#stage3d");
    loadViewer(function () {
      var mv = document.createElement("model-viewer");
      mv.setAttribute("src", modelUrl);
      mv.setAttribute("alt", "3D-модель: " + b.name);
      mv.setAttribute("camera-controls", "");
      mv.setAttribute("auto-rotate", "");
      mv.setAttribute("shadow-intensity", "1");
      mv.setAttribute("touch-action", "pan-y");
      mv.addEventListener("load", function () { msg.hidden = true; });
      mv.addEventListener("error", function () { msg.textContent = "Не удалось загрузить модель."; });
      stage.appendChild(mv);
    }, function () {
      msg.textContent = "Не удалось загрузить просмотрщик 3D. Проверьте интернет и попробуйте ещё раз.";
    });
  }

  function close3d() {
    m3d.classList.remove("open");
    m3d.innerHTML = "";
    document.body.style.overflow = "";
  }

  $("#open3d").addEventListener("click", open3d);
  m3d.addEventListener("click", function (e) { if (e.target.closest("#close3d")) close3d(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") close3d(); });

  // Просмотр фото на весь экран
  var lb = $("#lb"), lbImg = $("img", lb);
  app.addEventListener("click", function (e) {
    var btn = e.target.closest(".gallery button");
    if (!btn) return;
    lbImg.src = btn.getAttribute("data-src");
    lb.classList.add("open");
  });
  lb.addEventListener("click", function () { lb.classList.remove("open"); lbImg.removeAttribute("src"); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") lb.classList.remove("open");
  });
})();
</script>
</body>
</html>
